[package]
name = "agenvil"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Validate and build AI agent, skill and rule source trees"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
ignore = "0.4.34"
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = { version = "2.1.1", default-features = false, features = ["deserialize"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
toml = "1.2.1"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"
