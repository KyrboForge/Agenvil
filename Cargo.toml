[package]
name = "agenvil"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Validate and build AI agent, skill and rule source trees"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
