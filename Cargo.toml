[package]
name = "agenvil"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Validate and build AI agent, skill and rule source trees"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
ignore = "0.4.34"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = { version = "2.1.1", default-features = false, features = ["deserialize"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "raw_value"] }
sha2 = "0.11.1"
thiserror = "2.0.21"
toml = "1.2.1"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.6", features = ["fs"] }

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"
