# Only schema and project name are required.
schema = 1
[project]
name = "my-agents"

# [paths]
# agents = "agents"
# skills = "skills"
# rules = "rules"
# instructions = "instructions.md" # Portable project instructions; Claude target copies to CLAUDE.md
# policy = "POLICY.md"          # Enables PO001
# defaults = "config/defaults.toml" # Enables CF001
# bin = "bin"                  # Enables HY002

# [targets.claude]
# enabled = true

# Optional authoritative allowlists; omitted lists impose no project restriction.
# [policy.models.claude]
# models = ["sonnet", "opus"]
# efforts = ["medium", "high"]
# pairs = [["sonnet", "medium"], ["opus", "high"]]

# Explicit mapping for a pair Claude would not run as written.
# [[targets.claude.map]]
# source = ["claude-opus-4-6", "xhigh"]
# target = ["opus", "high"]

# [rules]
# SK002 = "warning" # Require skill model and effort declarations

# [[ignore]]
# rule = "AG002"
# path = "agents/vendor.md"
# reason = "Reviewed exception"

# [hygiene]
# personal_patterns = ['/Users/', '~/\.agents/']

# Opt in to Team Agents Kit defaults; explicit configuration wins.
# [compat]
# profile = "tak"
